[package]
name = "cranberry-waffles"
version = "0.1.0"
edition = "2024"
description = "A Ruby semantics research harness using Prism, Cranelift, and clif2wasm"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clif2wasm = { git = "https://github.com/Takashiidobe/clif2wasm", rev = "edf08ece9bd24991c1325cb3e99ee94a026be42d", version = "0.0.0", optional = true }
cranelift-codegen = { version = "0.136.0", default-features = false, features = ["std"], optional = true }
ruby-prism = "1.9.0"

[features]
wasm = ["dep:cranelift-codegen", "dep:clif2wasm"]

[dev-dependencies]
wasmi = "2.0.0"
wasmparser = "0.261"
